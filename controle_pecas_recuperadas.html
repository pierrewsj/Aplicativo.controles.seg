
<!DOCTYPE html>

<html data-theme="dark" lang="pt-BR">
<head>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stellantis - Controle de Peças Recuperadas</title>




<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="app-theme.css" rel="stylesheet"/>

</head>
<body><div class="app-container"><div class="card"><div class="header"><h1 class="h1">STELLANTIS</h1><h2 class="h2">Segurança Patrimonial</h2><h3 class="h3" style="font-size: 1.1rem; font-weight: 400; color: #ffffffcc; margin-bottom: 1rem;">Controle de Peças Recuperadas</h3></div>
<div class="container">
<div onclick="window.location.href='interface_principal.html';" style="position:absolute;top:16px;right:16px;z-index:9999;cursor:pointer;" title="Sair">
<svg fill="#00d2ff" height="30" viewbox="0 0 24 24" width="30" xmlns="http://www.w3.org/2000/svg">
<path d="M16 13v-2H7V8l-5 4 5 4v-3h9z"></path>
<path d="M20 3H10v2h10v14H10v2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path>
</svg>
</div>



<label>Setor:
      <select id="setor" onchange="exibirInputOutros()">
<option value="Caixaria G08">Caixaria G08</option>
<option value="Caixaria G89">Caixaria G89</option>
<option value="Pátio central de Embalagens">Pátio central de Embalagens</option>
<option value="Jis G04 - 72">Jis G04 - 72</option>
<option value="Jis G04 - 73">Jis G04 - 73</option>
<option value="Mecanismo G04">Mecanismo G04</option>
<option value="Interni G89">Interni G89</option>
<option value="66AU G09">66AU G09</option>
<option value="Ilha Ecológica G38">Ilha Ecológica G38</option>
<option value="Pátio de Sucatas G15">Pátio de Sucatas G15</option>
<option value="Outros">Outros</option>
</select>
<input class="input-outros" id="outrosSetor" placeholder="Digite o nome do setor" type="text"/>
</label>
<label>Turno:
      <select id="turno">
<option value="1º">1º</option>
<option value="2º">2º</option>
<option value="3º">3º</option>
</select>
</label>
<label>Número de Desenho:
      <input id="numeroDesenho" inputmode="numeric" pattern="\d*" type="number"/>
<span id="confirmIcon" style="display: none; margin-left: 0.5em;">✅</span>
</label>
<label>Descrição da Peça:
      <input id="descricaoPeca" type="text"/>
</label>
<label>Quantidade:
      <input id="quantidade" inputmode="numeric" min="1" pattern="\d*" type="number"/>
</label>
<label>Conferente:
      <input id="conferente" type="text"/>
</label>
<div class="info" id="info"></div>
<div class="auto-save-icon">💾 Salvamento automático</div>
<div class="button-group">
<button class="btn" onclick="adicionarItem()" type="button">➕ Adicionar</button>
<button class="btn" onclick="gerarPlanilha()" type="button">📄 Gerar Excel</button>
<button class="btn" onclick="desfazerUltimo()" type="button">↩️ Desfazer</button>
<button class="btn btn-danger" onclick="finalizarTurno()" type="button">✅ Finalizar Turno</button>
<button class="btn btn-ghost" id="visualizarTabelaBtn" type="button">📊 Visualizar Tabela</button>
</div>
<div aria-live="polite" id="toastContainer" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;align-items:center;"></div>
<table class="table" id="tabelaPecas">
<thead>
<tr>
<th>Setor</th>
<th>Turno</th>
<th>Conferente</th>
<th>N° Desenho</th>
<th>Descrição da Peça</th>
<th>Quantidade</th>
<th>Data e Hora</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="modal-custom" id="modalCustom" style="display:none;">
<div class="modal-content-custom">
<button class="close-btn-custom" onclick="fecharModalCustom()">×</button>
<span id="modalCustomMsg"></span>
</div>
</div>



<div aria-modal="true" id="confirmOverlay" role="dialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:11000;">
<div id="confirmBox" style="background:#142132;padding:18px;border-radius:16px;max-width:420px;width:calc(100% - 32px);color:#fff;">
<div class="title" style="font-weight:700;margin-bottom:8px;color:#00d2ff">Confirmação</div>
<div id="confirmMessage" style="color:#00d2ff">Tem certeza?</div>
<div class="actions" style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;">
<button class="btn btn-secondary" id="confirmCancelBtn" style="background:#2e3c51;color:#fff;border:none;min-height:40px;border-radius:10px;padding:.5rem 1rem;">Cancelar</button>
<button class="btn" id="confirmOkBtn" style="background:#3366ff;color:#fff;border:none;min-height:40px;border-radius:10px;padding:.5rem 1rem;">Confirmar</button>
</div>
</div>
</div>

</div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
window.addEventListener("beforeunload", () => {
  localStorage.setItem("pecas", JSON.stringify(pecas));
});

</script><script defer="" src="ui-core.js"></script></body>
</html>
